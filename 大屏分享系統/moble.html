<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>傳屏遙控器</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f2f2f7; color: #333; margin: 0; }
    .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
    label { font-size: 0.85rem; color: #666; font-weight: bold; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-size: 1rem; }
    
    /* 頁籤導覽 */
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px 4px; font-size: 0.85rem; border: none; background: #e5e5ea; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #007aff; color: white; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    button.action-btn { width: 100%; padding: 14px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
    button.stop-btn { background: #ff3b30; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-sub { background: #e5e5ea; color: #000; flex: 1; min-width: 45%; padding: 10px; border: none; border-radius: 8px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div style="padding: 15px;">
    <!-- 大屏 PIN 碼 -->
    <div class="card">
      <label for="room-input">目標大屏房間碼 (PIN)：</label>
      <input type="text" id="room-input" placeholder="例如：839201">
    </div>

    <!-- 模式分頁按鈕 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('url-tab')">網址推送</button>
      <button class="tab-btn" onclick="switchTab('camera-tab')">無線鏡頭</button>
      <button class="tab-btn" onclick="switchTab('mic-tab')">無線麥克風</button>
    </div>

    <!-- 分頁 1：網址推送 -->
    <div id="url-tab" class="tab-content active card">
      <label>貼上網址或 YouTube 連結：</label>
      <input type="url" id="url-input" placeholder="https://example.com">
      <button class="action-btn" onclick="sendUrl()">推送網址至大屏</button>

      <div style="margin-top: 15px;">
        <label>常用快捷頁面</label>
        <div class="btn-group">
          <button class="btn-sub" onclick="quickSend('https://your-app.com/?role=schedule')">今日課表</button>
          <button class="btn-sub" onclick="quickSend('')" style="color:red;">清空大屏</button>
        </div>
      </div>
    </div>

    <!-- 分頁 2：無線鏡頭 (實物投影) -->
    <div id="camera-tab" class="tab-content card">
      <p style="font-size: 0.9rem; color: #666; margin-bottom: 12px;">將手機鏡頭影像實時投射至大屏（可作為無線實物投影機）</p>
      <button id="cam-start-btn" class="action-btn" onclick="startWebRTC('camera')">開啟手機鏡頭投屏</button>
      <button id="cam-stop-btn" class="action-btn stop-btn" style="display:none;" onclick="stopWebRTC()">停止鏡頭投屏</button>
    </div>

    <!-- 分頁 3：無線麥克風 -->
    <div id="mic-tab" class="tab-content card">
      <p style="font-size: 0.9rem; color: #666; margin-bottom: 12px;">將手機變成無線麥克風，聲音將由大屏喇叭播報</p>
      <button id="mic-start-btn" class="action-btn" onclick="startWebRTC('mic')">開啟無線麥克風</button>
      <button id="mic-stop-btn" class="action-btn stop-btn" style="display:none;" onclick="stopWebRTC()">關閉麥克風</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      // ⚠️ 貼上您的 Firebase 配置
      apiKey: "AIzaSyBWa8b0rQl-qj-IWjP5hZntEi4ud_cOeVA",
      authDomain: "screen-pusher.firebaseapp.com",
      databaseURL: "https://screen-pusher-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "screen-pusher"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('room-input').value = urlParams.get('id') || '';

    let localStream = null;
    let peerConnection = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // 分頁切換
    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    };

    // 1. 發送網址邏輯
    window.sendUrl = function(targetUrl) {
      const screenId = getScreenId();
      if (!screenId) return;
      stopWebRTC(); // 推送網址時自動切斷 P2P 影音
      const url = targetUrl !== undefined ? targetUrl : document.getElementById('url-input').value.trim();
      set(ref(db, 'screens/' + screenId), { mode: 'url', url: url, updatedAt: Date.now() });
    };

    window.quickSend = function(url) {
      document.getElementById('url-input').value = url;
      window.sendUrl(url);
    };

    // 2. WebRTC (鏡頭 / 麥克風) 啟動邏輯
    window.startWebRTC = async function(type) {
      const screenId = getScreenId();
      if (!screenId) return;

      try {
        // 清空先前的 Signaling 資料
        remove(ref(db, 'screens/' + screenId));

        // 請求手機裝置權限 (Camera 鏡頭優先選擇後置鏡頭 environment)
        const constraints = type === 'camera' 
          ? { video: { facingMode: "environment" }, audio: true }
          : { video: false, audio: true };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        peerConnection = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            push(ref(db, `screens/${screenId}/callerCandidates`), event.candidate.toJSON());
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        // 寫入 Offer 訊號給大屏
        set(ref(db, `screens/${screenId}`), {
          mode: 'webrtc',
          mediaType: type,
          offer: { type: offer.type, sdp: offer.sdp }
        });

        // 監聽大屏回覆的 Answer
        onValue(ref(db, `screens/${screenId}/answer`), (snapshot) => {
          const answer = snapshot.val();
          if (answer && peerConnection.signalingState !== 'stable') {
            peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          }
        });

        // 監聽大屏傳來的 ICE 候選者
        onChildAdded(ref(db, `screens/${screenId}/calleeCandidates`), (snapshot) => {
          if (snapshot.val()) {
            peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
          }
        });

        // UI 狀態切換
        toggleMediaUI(type, true);

      } catch (err) {
        alert('無法開啟媒體設備，請確認已給予鏡頭/麥克風權限：' + err.message);
      }
    };

    // 停止影音傳播
    window.stopWebRTC = function() {
      const screenId = getScreenId();
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (screenId) {
        set(ref(db, 'screens/' + screenId), { mode: 'idle' });
      }
      toggleMediaUI('camera', false);
      toggleMediaUI('mic', false);
    };

    function getScreenId() {
      const id = document.getElementById('room-input').value.trim();
      if (!id) alert('請先輸入大屏房間碼！');
      return id;
    }

    function toggleMediaUI(type, isRunning) {
      if (type === 'camera') {
        document.getElementById('cam-start-btn').style.display = isRunning ? 'none' : 'block';
        document.getElementById('cam-stop-btn').style.display = isRunning ? 'block' : 'none';
      } else {
        document.getElementById('mic-start-btn').style.display = isRunning ? 'none' : 'block';
        document.getElementById('mic-stop-btn').style.display = isRunning ? 'block' : 'none';
      }
    }
  </script>
</body>
</html>
