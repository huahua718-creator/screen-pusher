<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>傳屏遙控器</title>
  <style>
    body { font-family: sans-serif; padding: 12px; background: #f2f2f7; color: #333; margin: 0; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
    label { font-size: 0.85rem; color: #666; font-weight: bold; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-size: 1rem; }
    
    .nav-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px 2px; font-size: 0.8rem; border: none; background: #e5e5ea; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #007aff; color: white; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    button.action-btn { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
    button.push-btn { background: #34c759; }
    button.stop-btn { background: #ff3b30; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-sub { background: #e5e5ea; color: #000; flex: 1; min-width: 45%; padding: 10px; border: none; border-radius: 8px; font-size: 0.85rem; }

    /* 手機畫筆面板：支援自動顯示拍下的照片背景 */
    #draw-pad { 
      width: 100%; 
      height: 320px; 
      background-color: #1c1c1e; 
      background-size: contain; 
      background-repeat: no-repeat; 
      background-position: center; 
      border-radius: 8px; 
      touch-action: none; 
      cursor: crosshair; 
      border: 1px solid #ddd;
    }
    .color-picker { display: flex; gap: 10px; margin: 10px 0; }
    .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <div style="padding: 5px;">
    <!-- 大屏房間碼 -->
    <div class="card">
      <label for="room-input">大屏房間碼 (PIN)：</label>
      <input type="text" id="room-input" placeholder="例如：839201">
    </div>

    <!-- 模式選擇分頁 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('url-tab', this)">網址推送</button>
      <button class="tab-btn" id="cam-tab-btn" onclick="switchTab('camera-tab', this)">鏡頭與拍照</button>
      <button class="tab-btn" id="draw-tab-btn" onclick="switchTab('draw-tab', this)">畫筆標註</button>
      <button class="tab-btn" onclick="switchTab('mic-tab', this)">麥克風</button>
    </div>

    <!-- 1. 網址推送 -->
    <div id="url-tab" class="tab-content active card">
      <label>貼上網址或 YouTube 連結：</label>
      <input type="url" id="url-input" placeholder="https://example.com">
      <button class="action-btn" onclick="sendUrl()">推送至大屏</button>

      <div style="margin-top: 15px;">
        <label>常用快捷頁面</label>
        <div class="btn-group">
          <button class="btn-sub" onclick="quickSend('https://your-app.com/?role=schedule')">今日課表</button>
          <button class="btn-sub" onclick="quickSend('')" style="color:red;">清空大屏</button>
        </div>
      </div>
    </div>

    <!-- 2. 無線鏡頭與拍照推送 -->
    <div id="camera-tab" class="tab-content card">
      <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">可進行【實時動態投屏】或【拍照定格推送到大屏】</p>
      
      <!-- 手機端鏡頭預覽 -->
      <div id="preview-box" style="display:none; margin-bottom: 10px;">
        <video id="local-preview" autoplay playsinline muted style="width:100%; border-radius:8px; background:#000;"></video>
        
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button class="action-btn push-btn" style="flex:1; font-size:0.9rem;" onclick="pushSnapshotToScreen()">🚀 拍照推送到大屏</button>
          <button class="action-btn" style="flex:1; background:#5856d6; font-size:0.9rem;" onclick="takeLocalSnapshot()">💾 拍照存到手機</button>
        </div>
      </div>

      <button id="cam-start-btn" class="action-btn" onclick="startWebRTC('camera')">開啟手機鏡頭</button>
      <button id="cam-stop-btn" class="action-btn stop-btn" style="display:none;" onclick="stopWebRTC()">關閉手機鏡頭</button>
    </div>

    <!-- 3. 畫筆標註 (自動呈現拍照背景) -->
    <div id="draw-tab" class="tab-content card">
      <label id="draw-status-label">在下方畫布上手指滑動，大屏同步繪製：</label>
      <canvas id="draw-pad"></canvas>
      
      <div class="color-picker">
        <div class="color-btn" style="background:#ff3b30;" onclick="setColor('#ff3b30')"></div>
        <div class="color-btn" style="background:#ffcc00;" onclick="setColor('#ffcc00')"></div>
        <div class="color-btn" style="background:#34c759;" onclick="setColor('#34c759')"></div>
        <div class="color-btn" style="background:#007aff;" onclick="setColor('#007aff')"></div>
        <div class="color-btn" style="background:#ffffff;" onclick="setColor('#ffffff')"></div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="action-btn stop-btn" style="flex: 1;" onclick="clearCanvas()">🧹 清除畫筆線條</button>
        <button class="action-btn" style="flex: 1; background:#8e8e93;" onclick="clearPhotoBackground()">🖼️ 移除背景照片</button>
      </div>
    </div>

    <!-- 4. 無線麥克風 -->
    <div id="mic-tab" class="tab-content card">
      <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">聲音由大屏喇叭即時播報</p>
      <button id="mic-start-btn" class="action-btn" onclick="startWebRTC('mic')">開啟無線麥克風</button>
      <button id="mic-stop-btn" class="action-btn stop-btn" style="display:none;" onclick="stopWebRTC()">關閉麥克風</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWa8b0rQl-qj-IWjP5hZntEi4ud_cOeVA",
      authDomain: "screen-pusher.firebaseapp.com",
      databaseURL: "https://screen-pusher-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "screen-pusher"

    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('room-input').value = urlParams.get('id') || '';

    let localStream = null;
    let peerConnection = null;
    let currentPhotoUrl = null; // 紀錄最新推播的照片 DataURL
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    window.switchTab = function(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      if (tabId === 'draw-tab') resizeDrawPad();
    };

    // 1. 網址推送
    window.sendUrl = function(targetUrl) {
      const screenId = getScreenId(); if (!screenId) return;
      stopWebRTC();
      const url = targetUrl !== undefined ? targetUrl : document.getElementById('url-input').value.trim();
      set(ref(db, 'screens/' + screenId), { mode: 'url', url: url, updatedAt: Date.now() });
    };
    window.quickSend = function(url) { document.getElementById('url-input').value = url; window.sendUrl(url); };

    // 2. 拍照推送到大屏並將照片自動同步設為手機畫布背景
    window.pushSnapshotToScreen = function() {
      const screenId = getScreenId(); if (!screenId) return;
      const video = document.getElementById('local-preview');
      if (!video || !video.srcObject) return;

      const canvas = document.createElement('canvas');
      let w = video.videoWidth || 1280, h = video.videoHeight || 720;
      const maxDim = 1280;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);
      
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      currentPhotoUrl = dataUrl;

      // 關閉 WebRTC 鏡頭串流
      stopWebRTC();

      // 設定手機端畫布背景照片
      setPadBackground(dataUrl);

      // 清空舊的畫筆標註，將新照片傳給大屏
      remove(ref(db, `screens/${screenId}/drawEvents`));
      set(ref(db, 'screens/' + screenId), {
        mode: 'photo',
        photoUrl: dataUrl,
        updatedAt: Date.now()
      }).then(() => {
        // 自動幫老師切換到畫筆標註分頁，體驗最流暢
        document.getElementById('draw-tab-btn').click();
      });
    };

    // 設定畫布背景照片
    function setPadBackground(url) {
      const pad = document.getElementById('draw-pad');
      if (url) {
        pad.style.backgroundImage = `url(${url})`;
        document.getElementById('draw-status-label').innerText = '📸 已載入照片，請直接在照片上方圈寫標註：';
      } else {
        pad.style.backgroundImage = 'none';
        document.getElementById('draw-status-label').innerText = '在下方畫布上手指滑動，大屏同步繪製：';
      }
    }

    // 移除畫布背景照片
    window.clearPhotoBackground = function() {
      currentPhotoUrl = null;
      setPadBackground(null);
    };

    // 本地拍照下載
    window.takeLocalSnapshot = function() {
      const video = document.getElementById('local-preview');
      if (!video || !video.srcObject) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280; canvas.height = video.videoHeight || 720;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      a.download = `photo_${Date.now()}.jpg`;
      a.click();
    };

    // 3. WebRTC 啟動與停止
    window.startWebRTC = async function(type) {
      const screenId = getScreenId(); if (!screenId) return;
      try {
        remove(ref(db, 'screens/' + screenId));
        const constraints = type === 'camera' 
          ? { video: { facingMode: "environment" }, audio: true }
          : { video: false, audio: true };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        peerConnection = new RTCPeerConnection(rtcConfig);

        if (type === 'camera') {
          const preview = document.getElementById('local-preview');
          preview.srcObject = localStream;
          document.getElementById('preview-box').style.display = 'block';
        }

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) push(ref(db, `screens/${screenId}/callerCandidates`), event.candidate.toJSON());
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        set(ref(db, `screens/${screenId}`), {
          mode: 'webrtc', mediaType: type, offer: { type: offer.type, sdp: offer.sdp }
        });

        onValue(ref(db, `screens/${screenId}/answer`), (snap) => {
          const ans = snap.val();
          if (ans && peerConnection.signalingState !== 'stable') {
            peerConnection.setRemoteDescription(new RTCSessionDescription(ans));
          }
        });

        toggleMediaUI(type, true);
      } catch (err) { alert('請確保已給予鏡頭/麥克風權限：' + err.message); }
    };

    window.stopWebRTC = function() {
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      document.getElementById('preview-box').style.display = 'none';
      toggleMediaUI('camera', false);
      toggleMediaUI('mic', false);
    };

    // 4. 手機畫筆板繪製邏輯
    const pad = document.getElementById('draw-pad');
    const pCtx = pad.getContext('2d');
    let drawing = false, lastX = 0, lastY = 0, currentColor = '#ff3b30';

    function resizeDrawPad() {
      // 避免重置 dimensions 導致已劃線條被擦除
      if (pad.width !== pad.clientWidth || pad.height !== pad.clientHeight) {
        pad.width = pad.clientWidth;
        pad.height = pad.clientHeight;
      }
    }

    window.setColor = function(color) { currentColor = color; };

    function handleStart(e) {
      drawing = true;
      const rect = pad.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      lastX = touch.clientX - rect.left;
      lastY = touch.clientY - rect.top;
    }

    function handleMove(e) {
      if (!drawing) return;
      const screenId = getScreenId(); if (!screenId) return;
      const rect = pad.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      const currentX = touch.clientX - rect.left;
      const currentY = touch.clientY - rect.top;

      pCtx.beginPath();
      pCtx.moveTo(lastX, lastY);
      pCtx.lineTo(currentX, currentY);
      pCtx.strokeStyle = currentColor;
      pCtx.lineWidth = 3;
      pCtx.lineCap = 'round';
      pCtx.stroke();

      push(ref(db, `screens/${screenId}/drawEvents`), {
        x0: lastX / pad.width, y0: lastY / pad.height,
        x1: currentX / pad.width, y1: currentY / pad.height,
        color: currentColor, size: 4
      });

      lastX = currentX; lastY = currentY;
    }

    function handleEnd() { drawing = false; }

    pad.addEventListener('touchstart', handleStart);
    pad.addEventListener('touchmove', handleMove);
    pad.addEventListener('touchend', handleEnd);
    pad.addEventListener('mousedown', handleStart);
    pad.addEventListener('mousemove', handleMove);
    pad.addEventListener('mouseup', handleEnd);

    window.clearCanvas = function() {
      const screenId = getScreenId(); if (!screenId) return;
      pCtx.clearRect(0, 0, pad.width, pad.height);
      remove(ref(db, `screens/${screenId}/drawEvents`));
    };

    function getScreenId() {
      const id = document.getElementById('room-input').value.trim();
      if (!id) alert('請先輸入大屏房間碼！');
      return id;
    }

    function toggleMediaUI(type, isRunning) {
      const startBtn = document.getElementById(type === 'camera' ? 'cam-start-btn' : 'mic-start-btn');
      const stopBtn = document.getElementById(type === 'camera' ? 'cam-stop-btn' : 'mic-stop-btn');
      startBtn.style.display = isRunning ? 'none' : 'block';
      stopBtn.style.display = isRunning ? 'block' : 'none';
    }
  </script>
</body>
</html>
